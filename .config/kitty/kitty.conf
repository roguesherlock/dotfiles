# vim:ft=kitty
#
# kitty.conf
# vim:fileencoding=utf-8:foldmethod=marker
# font_size 13.0
# modify_font cell_height 120%
font_size 12.0
modify_font cell_height 150%
modify_font underline_position 2
modify_font strikethrough_position 4px
undercurl_style thick-sparse


# Text Composition Strategy
# Rule of thumb:
#   First number (gamma) mainly affects dark text on light. Higher = thicker.
#   Second number (extra contrast %) nudges overall weight/edge contrast (helps light text on dark catch up).

# Balanced (good match light ↔ dark)
text_composition_strategy 1.20 18

# Crisp (a hair thinner, great for light backgrounds)
# text_composition_strategy 1.10 16

# Dark-theme biased (keep white-on-black from looking too spidery)
# text_composition_strategy 1.00 20

# Thick/comfortable (if you like macOS-y heft without the full default)
# text_composition_strategy 1.35 14

# macOS default feel (for reference)
# text_composition_strategy 1.70 30

# One good “set-and-forget” value (works well across both fonts + both themes)
# text_composition_strategy 1.18 18

# SF Mono
# Light
# text_composition_strategy 1.28 14
# Dark
# text_composition_strategy 1.04 20

tab_bar_style fade
tab_fade 1
tab_title_template "{index}.{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{activity_symbol} {fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
# active_tab_title_template "{index}.{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{activity_symbol} {fmt.fg.tab}{tab.last_focused_progress_percent}{title} {fmt.fg.tab}[{layout_name[1:2].upper()}]"
tab_activity_symbol 

hide_window_decorations no
window_padding_width 0
# background_opacity 0.80
# background_blur 26

macos_traditional_fullscreen yes
macos_option_as_alt left
macos_quit_when_last_window_closed yes
# macos_colorspace srgb
macos_colorspace displayp3


# Delay between screen updates (in milliseconds). Decreasing it, increases frames-per-second (FPS) at the cost of more CPU usage. The default value yields ~100 FPS which is more than sufficient for most uses. Note that to actually achieve 100 FPS, you have to either set sync_to_monitor to no or use a monitor with a high refresh rate. Also, to minimize latency when there is pending input to be processed, this option is ignored.
# repaint_delay 10
repaint_delay 5

# Delay before input from the program running in the terminal is processed (in milliseconds). Note that decreasing it will increase responsiveness, but also increase CPU usage and might cause flicker in full screen programs that redraw the entire screen on each loop, because kitty is so fast that partial screen updates will be drawn. This setting is ignored when the input buffer is almost full.
# input_delay 3
input_delay 1

# Sync screen updates to the refresh rate of the monitor. This prevents screen tearing when scrolling. However, it limits the rendering speed to the refresh rate of your monitor. With a very high speed mouse/high keyboard repeat rate, you may notice some slight input latency. If so, set this to no.
sync_to_monitor no

cursor_trail 3
# cursor_trail_decay 0.2 0.3
cursor_trail_start_threshold 3

enabled_layouts splits,stack

kitty_mod cmd+ctrl

# allow_remote_control socket-only
listen_on unix:/tmp/kitty
allow_remote_control yes
shell_integration enabled

enable_audio_bell no

# Send a notification when a command takes more than 10 seconds in a invisible window
notify_on_cmd_finish invisible 10.0


# =============================================================================
# ZELLIJ MODE (active) - Clear all keybinds, only essential shortcuts
# =============================================================================
# Clear all keybinds for zellij compatibility
clear_all_shortcuts yes

# Copy/Paste
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Font size
map super+equal change_font_size all +1.0
map super+plus change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0 change_font_size all 0

# macOS window management
map super+m minimize_macos_window
# map super+n new_os_window
# super+w passes through to zellij for pane management
# map super+q quit
map super+shift+enter toggle_fullscreen

# Config
map super+comma edit_config_file
map super+shift+comma load_config_file

# Shell line editing (matches ghostty)
# map super+left send_text all \x01
# map super+right send_text all \x05
# map super+backspace send_text all \x15

# Word navigation
# map alt+left send_text all \x1bb
# map alt+right send_text all \x1bf

# Clicks still work
mouse_map super+left click grabbed,ungrabbed mouse_handle_click selection link prompt

